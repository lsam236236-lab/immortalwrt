name: Build ImmortalWrt N60Pro
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential flex bison git libssl-dev libncurses5-dev \
          unzip gawk gettext wget python3 python3-pip file

      - name: Add OpenClash feed
        run: echo "src-git openclash https://github.com/vernesong/OpenClash.git" >> feeds.conf.default

      - name: Update feeds & install packages
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Write .config
        run: |
          echo 'CONFIG_TARGET_mediatek=y' > .config
          echo 'CONFIG_TARGET_mediatek_filogic=y' >> .config
          echo 'CONFIG_TARGET_mediatek_filogic_DEVICE_netcore_n60_pro=y' >> .config
          echo 'CONFIG_PACKAGE_luci=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-zh-cn=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-passwall=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Hysteria=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-passwall_INCLUDE_NaiveProxy=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-openclash=y' >> .config
          echo 'CONFIG_PACKAGE_zerotier=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-zerotier=y' >> .config
          echo 'CONFIG_PACKAGE_wpad-openssl=y' >> .config
          echo 'CONFIG_PACKAGE_ddns-scripts=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-ddns=y' >> .config
          echo 'CONFIG_PACKAGE_curl=y' >> .config
          echo 'CONFIG_PACKAGE_wget=y' >> .config
          echo 'CONFIG_PACKAGE_tcpdump=y' >> .config
          make defconfig

      - name: Download source
        run: make -j$(nproc) download

      - name: Compile firmware
        run: make -j$(nproc)

      - name: Upload firmware bin
        uses: actions/upload-artifact@v4
        with:
          name: N60Pro-ImmortalWrt
          path: bin/targets/mediatek/filogic/*.bin
