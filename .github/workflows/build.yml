name: Build ImmortalWrt N60Pro
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup build env
        uses: immortalwrt/setup-buildenv@main

      - name: Modify feeds
        run: |
          cat >> feeds.conf.default <<EOF
src-git passwall https://github.com/openwrt-passwall/openwrt-passwall.git
src-git passwall_packages https://github.com/openwrt-passwall/openwrt-passwall-packages.git
src-git openclash https://github.com/vernesong/OpenClash.git
EOF
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate .config
        run: |
          cat > .config <<EOF
CONFIG_TARGET_mediatek=y
CONFIG_TARGET_mediatek_filogic=y
CONFIG_TARGET_MULTI_PROFILE=y
CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_netcore_n60-pro=y

# 基础LuCI
CONFIG_PACKAGE_luci=y
CONFIG_PACKAGE_luci-light=y
CONFIG_PACKAGE_luci-i18n-base-zh-cn=y

# PassWall全套
CONFIG_PACKAGE_luci-app-passwall=y
CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y
CONFIG_PACKAGE_xray-core=y
CONFIG_PACKAGE_sing-box=y
CONFIG_PACKAGE_shadowsocks-libev-ss-local=y
CONFIG_PACKAGE_shadowsocks-libev-ss-redir=y
CONFIG_PACKAGE_shadowsocksr-libev-ssr-local=y
CONFIG_PACKAGE_shadowsocksr-libev-ssr-redir=y
CONFIG_PACKAGE_trojan-plus=y
CONFIG_PACKAGE_hysteria=y
CONFIG_PACKAGE_tuic-client=y
CONFIG_PACKAGE_naiveproxy=y
CONFIG_PACKAGE_chinadns-ng=y
CONFIG_PACKAGE_dns2socks=y
CONFIG_PACKAGE_tcping=y
CONFIG_PACKAGE_microsocks=y
CONFIG_PACKAGE_dnsmasq-full=y
# 注释原版dnsmasq
# CONFIG_PACKAGE_dnsmasq is not set

# 透明代理内核模块
CONFIG_PACKAGE_kmod-tun=y
CONFIG_PACKAGE_kmod-nft-tproxy=y
CONFIG_PACKAGE_kmod-nft-socket=y

# ZeroTier
CONFIG_PACKAGE_luci-app-zerotier=y
CONFIG_PACKAGE_zerotier=y

# OpenClash
CONFIG_PACKAGE_luci-app-openclash=y

# 无线驱动（N60Pro必须，否则WiFi无信号）
CONFIG_PACKAGE_kmod-mt7986=y
CONFIG_PACKAGE_wpad-mesh-openssl=y
EOF
          make defconfig

      - name: Compile firmware
        run: make -j$(nproc)

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: bin/targets/mediatek/filogic/*.itb
